[project]
name = "punctual"
version = "0.1.0"
description = "Geofenced employee time clock"
readme = "README.md"
authors = [{ name = "Catalin Trifu" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "segno>=1.6.6",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
punctual = "punctual.main:main"
punctual-admin = "punctual.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = ["server_env(**env): extra PUNCTUAL_* settings for the E2E live server"]
