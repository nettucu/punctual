<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f0542a"><link rel="icon" href="/brand/logo"><link rel="stylesheet" href="/static/app.css"><title data-i18n="dashboard.title">Punctual · Dashboard</title>
<body><main><h1 data-i18n="nav.dashboard">Dashboard</h1><p class="sub" id="date"></p>
<p class="hint ok" id="dayinfo" hidden></p>
<div class="grid stats" id="stats"></div><br>
<div class="card flush" id="present"><div style="padding:1.25rem 1.25rem 0"><h2 data-i18n="dashboard.present">Present now</h2></div><div class="tbl"><table><thead><tr><th data-i18n="common.employee">Employee<th data-i18n="dashboard.col.site">Site<th data-i18n="dashboard.col.since">Since</thead><tbody id="in"></tbody></table></div></div>
<div class="card flush" id="fgcard" hidden><div style="padding:1.25rem 1.25rem 0"><h2 data-i18n="dashboard.forgotten">Unclosed shifts</h2><p class="hint" style="margin-top:-.4rem" data-i18n="dashboard.forgotten_hint">Arrivals without a departure after the cutoff hour. The employee is blocked until they declare when they left; you can also add the departure from Corrections.</p></div><div class="tbl"><table><thead><tr><th data-i18n="common.employee">Employee<th data-i18n="dashboard.col.site">Site<th data-i18n="dashboard.col.arrival">Arrival<th></thead><tbody id="fg"></tbody></table></div></div>
<div class="card flush" id="review"><div style="padding:1.25rem 1.25rem 0"><h2 data-i18n="dashboard.review">To review · last 14 days</h2></div><div class="tbl"><table><thead><tr><th data-i18n="common.employee">Employee<th data-i18n="dashboard.col.date">Date<th data-i18n="dashboard.col.notes">Notes<th></thead><tbody id="flag"></tbody></table></div></div>
</main><script src="/i18n.js"></script><script src="/static/app.js"></script>
<script>
const {h,api,t}=P;
const TONE={open:'warn','missing out':'bad','orphan out':'bad','long shift':'warn',over_norma:'brand',location:'bad'};
const label=n=>t('anomaly.'+n.replace(' ','_'));
const empty=(text,n)=>h('tr',{},h('td',{colspan:n,class:'empty'},text));
(async()=>{const me=await api('GET','/auth/me');if(me.role!=='admin'){location.href='/';return}P.header(me,true);
 date.textContent=new Date().toLocaleDateString(P.locale,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const d=await api('GET','/api/admin/overview');
 const info=[];if(d.today_holiday)info.push(t('dashboard.holiday_today',{name:d.today_holiday}));
 if(d.on_leave_today.length)info.push(t('dashboard.on_leave',{list:d.on_leave_today.map(x=>x.name+' ('+x.code+')').join(', ')}));
 dayinfo.hidden=!info.length;dayinfo.textContent=info.join(' · ');
 stats.replaceChildren(...[[d.clocked_in.length,t('dashboard.stat.present'),'hot','clock','#present'],[d.employees,t('dashboard.stat.employees'),'','employees','/admin/employees'],[d.sites,t('dashboard.stat.sites'),'','sites','/admin/sites'],[d.pending_requests,t('dashboard.stat.corrections'),d.pending_requests?'hot':'','corrections','/admin/corrections'],[d.pending_leave,t('dashboard.stat.leave'),d.pending_leave?'hot':'','leave','/admin/leave'],[d.flagged_days.length,t('dashboard.stat.review'),'','alert','#review'],[d.rejected_7d,t('dashboard.stat.rejected'),'','shield','/admin/attempts']]
  .map(([n,l,c,ic,href])=>h('a',{class:'card stat '+c,style:'margin:0',href},h('span',{style:'display:flex;align-items:center;gap:.4rem'},P.icon(ic,16),l),h('b',{},n))));
 document.getElementById('in').replaceChildren(...(d.clocked_in.length?d.clocked_in.map(x=>h('tr',{},h('td',{},h('b',{},x.name)),h('td',{},x.site),h('td',{},x.since+(x.pending?t('dashboard.to_confirm'):'')))):[empty(t('dashboard.nobody'),3)]));
 fgcard.hidden=!d.forgotten_open.length;
 fg.replaceChildren(...d.forgotten_open.map(x=>h('tr',{},h('td',{},h('b',{},x.name)),h('td',{},x.site),h('td',{},x.since),h('td',{},x.punch_id?h('a',{href:'/admin/corrections?'+new URLSearchParams({date:x.since.slice(0,10),employee_id:x.employee_id,site_id:x.site_id,punch:x.punch_id,fix:'out'}),class:'btn ghost sm'},t('dashboard.fix')):h('a',{href:'/admin/corrections?'+new URLSearchParams({date:x.since.slice(0,10),employee_id:x.employee_id}),class:'btn ghost sm',title:t('dashboard.view_request_title')},t('dashboard.view_request'))))));
 flag.replaceChildren(...(d.flagged_days.length?d.flagged_days.map(x=>h('tr',{},h('td',{},h('b',{},x.employee)),h('td',{},x.day),
  h('td',{},x.notes.map(n=>h('span',{class:'badge '+(TONE[n]||'')},label(n)))),
  h('td',{class:'num'},h('a',{href:'/admin/corrections?'+new URLSearchParams({date:x.day,employee_id:x.employee_id}),class:'btn ghost sm',style:'margin-right:.3rem'},t('dashboard.fix')),
   h('button',{class:'btn sm',title:t('dashboard.verified_title'),onclick:async()=>{const reason=prompt(t('dashboard.verified_prompt'));
    if(reason&&reason.trim().length>=3){await api('POST','/api/corrections/reviews',{employee_id:x.employee_id,day:x.day,reason:reason.trim()});P.toast(t('dashboard.verified_done'));location.reload()}}},t('dashboard.verified'))))):[empty(t('dashboard.nothing_to_review'),4)]))})();
</script></body></html>
