<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f0542a"><link rel="icon" href="/brand/logo"><link rel="stylesheet" href="/static/app.css"><title data-i18n="login.title">Punctual · Sign in</title>
<body class="hero"><div class="card login"><img src="/brand/logo" alt="Punctual">
<h1 data-i18n="login.welcome">Welcome</h1><p class="sub" data-i18n="login.sub">Sign in to record your attendance.</p>
<form id="f" class="form"><div><label for="e" data-i18n="common.email">Email</label><input id="e" name="email" type="email" required autocomplete="username" autofocus></div>
<div><label for="p" data-i18n="common.password">Password</label><input id="p" name="password" type="password" required autocomplete="current-password"></div>
<button class="btn" id="b" data-i18n="login.submit">Sign in</button></form></div>
<script src="/i18n.js"></script><script src="/static/app.js"></script>
<script>
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;
const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
if(!r.ok){P.toast(P.t('login.bad'),'bad');b.disabled=false;return}
const me=await r.json();const nx=new URLSearchParams(location.search).get('next');
location.href=/^\/p\/[\w-]+$/.test(nx||'')?nx:(me.role==='admin'?'/admin':'/')}
</script></body></html>
